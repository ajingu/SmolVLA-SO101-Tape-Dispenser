[project]
name = "smolvla-fine-tuning"
version = "0.1.0"
description = "Minimal SO-ARM data collection and evaluation helpers for SmolVLA fine-tuning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub",
    "lerobot[feetech,smolvla]",
    "opencv-python",
    "pandas",
    "pyarrow",
    "pyserial",
    "torch>=2.10",
    "torchvision>=0.25",
    "wandb",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]

[project.scripts]
svla = "svla.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
